[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autodarts-headless-control"
version = "1.0.0"
description = "Lokale Weboberfläche und Systemsteuerung für Autodarts Headless auf Linux (Raspberry Pi & x86 Mini-PCs)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "websockets>=13,<18"  # benötigt websockets.asyncio.server,
]

[tool.setuptools.packages.find]
include = ["app*"]
